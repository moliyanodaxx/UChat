<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>UChat--网络聊天室</title>
    <link rel="stylesheet" href="./chatroom.css?v=17">
    <meta name="cache-control" content="no-cache">
    <meta name="expires" content="0">
    <meta name="pragma" content="no-cache">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">UChat</div>
                <div class="sidebar-actions">
                    <button class="icon-btn" id="friendsBtn" title="好友">👥</button>
                    <button class="icon-btn" id="profileBtn" title="个人中心">👤</button>
                    <button class="icon-btn" id="createRoomBtn" title="创建房间">➕</button>
                    <button class="icon-btn" id="joinRoomBtn" title="加入房间">🔍</button>
                </div>
            </div>

            <div class="chat-list" id="roomList">
                <!-- 房间列表将由 JS 动态生成 -->
            </div>
        </div>

        <!-- 主聊天区域 -->
        <div class="chat-area">
            <!-- 聊天头部 -->
            <div class="chat-header">
                <div class="chat-header-info">
                    <div class="avatar">💬</div>
                    <div class="header-text">
                        <div class="chat-title" id="currentRoomName">在线聊天室</div>
                        <div class="chat-status">
                            <span id="onlineCount">0</span> 人在线
                        </div>
                    </div>
                </div>
                <div class="chat-actions">
                    <button class="icon-btn" id="roomMenuBtn">⋮</button>
                </div>
            </div>

            <!-- 消息区域 -->
            <div class="messages-container" id="messagesContainer">
                <div class="date-divider">
                    <span>今天</span>
                </div>
            </div>

            <!-- 输入区域 -->
            <div class="input-area">
                <button class="icon-btn attach-btn">📎</button>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="输入消息..."
                        autocomplete="off"
                    >
                    <button class="icon-btn emoji-btn" id="emojiBtn">😊</button>
                </div>
                <button class="send-btn" id="sendBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path fill="currentColor" d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/>
                    </svg>
                </button>
            </div>

            <!-- 表情选择器 -->
            <div class="emoji-picker" id="emojiPicker">
                <div class="emoji-picker-header">
                    <span class="emoji-picker-title">选择表情</span>
                    <button class="emoji-picker-close" id="emojiPickerClose">×</button>
                </div>
                <div class="emoji-picker-body" id="emojiPickerBody">
                </div>
            </div>
        </div>
    </div>

    <!-- 登录/注册弹窗 -->
    <div class="modal-overlay" id="authModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="authTitle">欢迎来到UChat</h2>
                <p id="authSubtitle">请登录或注册</p>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>账号（10位字母或数字）</label>
                    <input
                        type="text"
                        id="accountInput"
                        placeholder="输入账号"
                        maxlength="10"
                    >
                </div>
                <div class="input-group">
                    <label>密码（8-10位字母或数字）</label>
                    <input
                        type="password"
                        id="passwordInput"
                        placeholder="输入密码"
                        maxlength="10"
                    >
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="switchAuthBtn">注册</button>
                <button class="btn-primary" id="authBtn">登录</button>
            </div>
        </div>
    </div>

    <!-- 用户资料设置弹窗 -->
    <div class="modal-overlay hidden" id="profileModal">
        <div class="modal">
            <div class="modal-header">
                <h2>设置个人资料</h2>
                <p>首次登录，请设置昵称和头像</p>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>昵称</label>
                    <input
                        type="text"
                        id="nicknameInput"
                        placeholder="输入昵称"
                        maxlength="20"
                    >
                </div>
                <div class="input-group">
                    <label>选择头像</label>
                    <div class="avatar-selector" id="avatarSelector">
                        <!-- 头像选项将由 JS 生成 -->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" id="saveProfileBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- 用户名设置弹窗（已废弃，保留用于兼容） -->
    <div class="modal-overlay hidden" id="usernameModal">
        <div class="modal">
            <div class="modal-header">
                <h2>欢迎来到UChat</h2>
                <p>请设置你的昵称</p>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <input
                        type="text"
                        id="usernameInput"
                        placeholder="输入昵称"
                        maxlength="20"
                    >
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" id="joinBtn">开始聊天</button>
            </div>
        </div>
    </div>

    <!-- 创建房间弹窗 -->
    <div class="modal-overlay hidden" id="createRoomModal">
        <div class="modal">
            <div class="modal-header">
                <h2>创建房间</h2>
                <p>设置房间信息</p>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>房间名称</label>
                    <input type="text" id="roomNameInput" placeholder="输入房间名称" maxlength="20">
                </div>
                <div class="input-group">
                    <label>房间号（10位数字）</label>
                    <input type="text" id="roomIdInput" placeholder="留空自动生成" maxlength="10">
                </div>
                <div class="input-group">
                    <label>房间密码（6位）</label>
                    <input type="password" id="roomPasswordInput" placeholder="输入6位密码" maxlength="6">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelCreateBtn">取消</button>
                <button class="btn-primary" id="confirmCreateBtn">创建</button>
            </div>
        </div>
    </div>

    <!-- 加入房间弹窗 -->
    <div class="modal-overlay hidden" id="joinRoomModal">
        <div class="modal">
            <div class="modal-header">
                <h2>加入房间</h2>
                <p>输入房间信息</p>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>房间号</label>
                    <input type="text" id="joinRoomIdInput" placeholder="输入10位房间号" maxlength="10">
                </div>
                <div class="input-group">
                    <label>房间密码</label>
                    <input type="password" id="joinRoomPasswordInput" placeholder="输入密码" maxlength="6">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelJoinBtn">取消</button>
                <button class="btn-primary" id="confirmJoinBtn">加入</button>
            </div>
        </div>
    </div>

    <!-- 房间菜单弹窗 -->
    <div class="room-menu hidden" id="roomMenu">
        <div class="room-menu-header">
            <h3>房间信息</h3>
            <button class="room-menu-close" id="roomMenuClose">×</button>
        </div>
        <div class="room-info" id="roomInfo">
            <!-- 房间信息将由 JS 动态生成 -->
        </div>
        <div class="room-menu-header" style="border-top: 1px solid var(--border-color);">
            <h3>房间成员</h3>
        </div>
        <div class="room-menu-body" id="roomMenuBody">
            <!-- 成员列表将由 JS 动态生成 -->
        </div>
        <div class="room-menu-footer" id="roomMenuFooter">
            <button class="btn-secondary" id="inviteFriendBtn">邀请好友</button>
            <button class="btn-danger" id="leaveRoomBtn">退出房间</button>
        </div>
    </div>

    <!-- 个人主页弹窗 -->
    <div class="modal-overlay hidden" id="profileViewModal">
        <div class="modal large-modal">
            <div class="modal-header">
                <h2 id="profileViewTitle">个人主页</h2>
                <button class="modal-close-btn" id="closeProfileViewModal">×</button>
            </div>
            <div class="modal-body">
                <div class="profile-view">
                    <div class="profile-avatar-large" id="profileAvatar">😀</div>
                    <div class="profile-info">
                        <div class="profile-field">
                            <label>昵称</label>
                            <div id="profileNickname">-</div>
                        </div>
                        <div class="profile-field">
                            <label>账号</label>
                            <div id="profileAccount">-</div>
                        </div>
                        <div class="profile-field">
                            <label>个性签名</label>
                            <div id="profileSignature">这个人很懒，什么都没留下</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer" id="profileViewActions">
                <button class="btn-secondary" id="editProfileBtn">编辑资料</button>
                <button class="btn-primary hidden" id="addFriendBtn">添加好友</button>
            </div>
        </div>
    </div>

    <!-- 编辑资料弹窗 -->
    <div class="modal-overlay hidden" id="editProfileModal">
        <div class="modal">
            <div class="modal-header">
                <h2>编辑个人资料</h2>
                <button class="modal-close-btn" id="closeEditProfileModal">×</button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>昵称</label>
                    <input type="text" id="editNicknameInput" maxlength="20">
                </div>
                <div class="input-group">
                    <label>选择头像</label>
                    <div class="avatar-selector" id="editAvatarSelector"></div>
                </div>
                <div class="input-group">
                    <label>个性签名</label>
                    <textarea id="editSignatureInput" maxlength="100" rows="3" placeholder="介绍一下自己吧..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="closeEditProfileModal">取消</button>
                <button class="btn-primary" id="saveEditProfileBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- 好友列表弹窗 -->
    <div class="modal-overlay hidden" id="friendsModal">
        <div class="modal large-modal">
            <div class="modal-header">
                <h2>好友</h2>
                <button class="modal-close-btn" id="closeFriendsModal">×</button>
            </div>
            <div class="modal-body">
                <div class="friends-tabs">
                    <button class="friend-tab active" id="friendsTab">好友列表</button>
                    <button class="friend-tab" id="requestsTab">好友请求</button>
                    <button class="friend-tab" id="searchTab">搜索用户</button>
                </div>
                <div class="friend-content active" id="friendsContent">
                    <div id="friendsList"></div>
                </div>
                <div class="friend-content" id="requestsContent">
                    <div id="requestsList"></div>
                </div>
                <div class="friend-content" id="searchContent">
                    <div class="search-box">
                        <input type="text" id="searchUserInput" placeholder="输入账号或昵称搜索">
                        <button class="btn-primary" id="searchUserBtn">搜索</button>
                    </div>
                    <div id="searchResults"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 右键菜单 -->
    <div class="context-menu" id="contextMenu"></div>

    <!-- 邀请好友弹窗 -->
    <div class="modal-overlay hidden" id="inviteFriendModal">
        <div class="modal">
            <div class="modal-header">
                <h2>邀请好友</h2>
                <button class="modal-close-btn" id="closeInviteModal">×</button>
            </div>
            <div class="modal-body">
                <div id="inviteFriendList"></div>
            </div>
        </div>
    </div>

    <script src="./chatroom.js?v=17"></script>
</body>
</html>
